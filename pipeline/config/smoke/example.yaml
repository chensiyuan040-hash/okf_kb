# 召回冒烟题库(§8.2:每库 5–10 题冒烟级基线;完整黄金问题集 P2 后置)。
# 复制为 <源>.yaml(如 confluence.yaml);批末自动跑(pipeline/orchestrator/smoke.py),
# 也可手工:python3 -m pipeline.manage --source <源> smoke
#
# 题目三型配比参考:直问 / 同义改写 / 跨页综合;expect 为页标题子串(命中任一即通过)。
# misses 以 warn 级入巡检摘要——召回退化先提示、后人工分析,不上阻断。

queries:
  - q: "网关证书多久轮换一次"
    expect: ["网关证书轮换"]
  - q: "发布出故障了怎么回滚"
    expect: ["发布回滚流程"]        # 同义改写:不以原标题措辞提问
  - q: "证书轮换和发布回滚有什么共同的操作纪律"
    expect: ["网关证书轮换", "发布回滚流程"]   # 跨页综合
    k: 8
